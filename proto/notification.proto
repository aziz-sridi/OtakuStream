syntax = "proto3";

package notification;

service NotificationService {
  rpc GetNotifications (UserIdRequest) returns (NotificationList);
  rpc MarkAsRead (NotificationIdRequest) returns (Notification);
  rpc DeleteNotification (NotificationIdRequest) returns (Empty);
}

message UserIdRequest {
  string user_id = 1;
  int32 limit = 2;
}

message NotificationIdRequest {
  string id = 1;
}

message Notification {
  string id = 1;
  string user_id = 2;
  string type = 3;
  string title = 4;
  string body = 5;
  bool read = 6;
  string created_at = 7;
}

message NotificationList {
  repeated Notification items = 1;
}

message Empty {}
